name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - supabase/functions/**
      - supabase/config.toml
      - .github/workflows/deploy-supabase-functions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy Edge Functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          set +x

          for secret_name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            secret_value="${!secret_name}"
            if [[ -z "$secret_value" ]]; then
              printf '::error::Required secret %s is not configured.\n' "$secret_name"
              exit 1
            fi
            printf '::add-mask::%s\n' "$secret_value"
          done

          supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_ID"
